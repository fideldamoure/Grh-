name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare sources and Arabic font
        run: |
          test -f main.dart || { echo "ERROR: main.dart is missing from the repository root"; exit 1; }
          mkdir -p lib
          cp main.dart lib/main.dart
          sudo apt-get install -y fonts-dejavu-core
          mkdir -p assets/fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf assets/fonts/
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf assets/fonts/

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name inspection_app

      - name: Set app label
        run: sed -i 's/android:label="[^"]*"/android:label="مراقبة الانتقاء"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: inspection-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
